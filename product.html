<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.product-page{
max-width:900px;
margin:auto;
padding:20px;
}

.product-page img{
width:100%;
border-radius:20px;

}

.product-price{

.buy-now:hover{

<a href="index.html" class="icon-btn">

<div></div>

</header>

<p>
Premium ChatGPT subscription with fast access and advanced features.
</p>

<div class="product-price">

</div>

</button>
