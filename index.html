<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunify</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- Header -->
<header class="header">

<button class="icon-btn">
<i class="fas fa-user"></i>
</button>

<div class="logo">
TUNIFY
</div>

<button class="icon-btn" id="menuBtn">
<i class="fas fa-bars"></i>
</button>

</header>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">

<div class="sidebar-header">
<span>TUNIFY</span>
<button id="closeMenu">✕</button>
</div>

<ul>

<li>🏠 الرئيسية</li>

<li>🎮 عملات الألعاب</li>

<li>📺 الاشتراكات الشهرية</li>

<li>🎁 بطاقات الهدايا</li>

<li>🔥 العروض الخاصة</li>

<li>📞 اتصل بنا</li>

</ul>

</div>

<div class="overlay" id="overlay"></div>

<!-- Search -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="🔍 ابحث عن منتج..."
>

</div>

<!-- Categories -->

<section class="categories">

<button>🎮 الألعاب</button>

<button>📺 الاشتراكات</button>

<button>🎁 البطاقات</button>

<button>🔥 العروض</button>

</section>

<!-- Latest Products -->

<section class="section">

<h2>آخر المنتجات المضافة</h2>

<div class="products">

<div class="product">
<img src="https://via.placeholder.com/300x200">
<h3>YouTube Premium</h3>
<p>12 DT</p>
</div>

<div class="product">
<img src="https://via.placeholder.com/300x200">
<h3>PUBG UC</h3>
<p>8 DT</p>
</div>

<div class="product">
<img src="https://via.placeholder.com/300x200">
<h3>Spotify Premium</h3>
<p>10 DT</p>
</div>

<div class="product">
<img src="https://via.placeholder.com/300x200">
<h3>Netflix</h3>
<p>20 DT</p>
</div>

<div class="product">
<img src="https://via.placeholder.com/300x200">
<h3>Free Fire</h3>
<p>5 DT</p>
</div>

<div class="product">
<img src="https://via.placeholder.com/300x200">
<h3>ChatGPT Go</h3>
<p>15 DT</p>
</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
